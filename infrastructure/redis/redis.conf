# =============================================================================
# Acing IU — Redis 7 configuration (JWT revocation + short-lived cache)
# =============================================================================

# Network
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory — optimized for revocation blacklist + session cache
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence — AOF for revocation durability across restarts
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshot (secondary)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Security — password is injected via --requirepass at runtime
# (see docker-compose.yml). Do not hard-code secrets here.

# Keyspace notifications (optional — useful for token TTL events)
notify-keyspace-events Ex

# Logging to stdout for Docker / FluentBit / Loki collection
loglevel notice
logfile ""

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable dangerous commands in shared environments (uncomment if needed)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
