# Temporary Identity stub — replace with real .NET Identity service in S2

server {
    listen 8080;
    server_name _;

    # Structured-ish access log to stdout
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /health/live {
        default_type application/json;
        return 200 '{"status":"ok","service":"identity-placeholder","version":"s1-stub"}';
    }

    location = /health/ready {
        default_type application/json;
        return 200 '{"status":"ready","service":"identity-placeholder","note":"Replace with real Identity service (S2)"}';
    }

    # Stub all auth routes so gateway routing can be verified
    location /api/auth/ {
        default_type application/problem+json;
        return 501 '{"type":"https://acing.iu/problems/not-implemented","title":"Identity service not yet implemented","status":501,"detail":"S2 Identity microservice endpoints are pending. This is the S1 placeholder."}';
    }

    location / {
        default_type application/problem+json;
        return 404 '{"type":"https://acing.iu/problems/not-found","title":"Not Found","status":404}';
    }
}
