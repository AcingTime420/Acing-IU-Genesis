title = "Acing IU Gitleaks policy"

[extend]
useDefault = true

[[allowlists]]
description = "Historical auth/doc findings; provenance still requires maintainer validation."
condition = "AND"
regexTarget = "match"
commits = [
  '''2b0cb1345a4d4fc309f849b86136a00463b92ce9''',
  '''bdb3a9474b96e4bfaaab888412631b27f40756c7''',
]
paths = [
  '''^acing-iu/backend/Identity/Controllers/AuthController\.cs$''',
  '''^backend/Identity/Controllers/AuthController\.cs$''',
  '''^acing-iu/docs/API\.md$''',
]
regexes = [
  '''AccessToken\s*=\s*"[A-Za-z0-9._-]{8,}"''',
  '''accessToken"\s*:\s*"[A-Za-z0-9._-]{8,}"''',
  '''refreshToken"\s*:\s*"[0-9a-fA-F-]{36}"''',
  '''secretKey"\s*:\s*"[A-Z2-7]{8,}"''',
]

[[allowlists]]
description = "Historical Refact memory finding; provenance still requires maintainer validation."
condition = "AND"
regexTarget = "match"
commits = ['''2b0cb1345a4d4fc309f849b86136a00463b92ce9''']
paths = ['''^\.refact/buddy/memory_ops\.jsonl$''']
regexes = ['''idempotency_key":"[A-Za-z0-9_-]{8,}"''']

[[allowlists]]
description = "Historical generated controller's truncated, unsigned JWT example."
condition = "AND"
regexTarget = "match"
commits = ['''89e2db8f9ee7964c7c6262e26f0c303913d120eb''']
paths = ['''^installer/payload/platform/backend/Identity/Controllers/AuthController\.cs$''']
regexes = ['''^AccessToken\s*=\s*"[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.{3}"$''']

[[allowlists]]
description = "Historical environment templates' literal non-secret placeholders."
condition = "AND"
regexTarget = "match"
commits = [
  '''0674d32d228aac265379a016ddca77d9eb508cd3''',
  '''8810dfe6827b9d8bc6fb317cec9aa948d0c365d6''',
  '''9148291b602bae3646c8b1516a989f57d944f16d''',
]
paths = [
  '''^\.env\.example$''',
  '''^infrastructure/\.env\.example$''',
  '''^installer/payload/platform/\.env\.example$''',
]
regexes = [
  '''^JWT_SIGNING_KEY=placeholder_signing_key_32_chars$''',
  '''^MFA_SECRET_PROTECTION_KEY_MFA_V1=placeholder_key_32_bytes$''',
]
