# Acing IU — Gateway route table
upstream identity_upstream {
    server identity:8080;
    keepalive 16;
}

upstream device_trust_upstream {
    server device-trust:8081;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    set $trace_id $req_id;
    proxy_set_header X-Request-Id $trace_id;
    proxy_set_header X-Correlation-Id $trace_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"acing-gateway"}';
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://identity_upstream/health/live;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /api/auth/ {
        proxy_pass http://identity_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location /api/trust/ {
        proxy_pass http://device_trust_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/firmware/ {
        default_type application/problem+json;
        return 503 '{"type":"https://acing.iu/problems/service-unavailable","title":"Firmware Intelligence service not yet deployed","status":503,"detail":"S4 Firmware microservice is not running in this stack."}';
    }

    location / {
        default_type application/problem+json;
        return 404 '{"type":"https://acing.iu/problems/not-found","title":"Not Found","status":404,"detail":"No route matched the requested path."}';
    }
}
