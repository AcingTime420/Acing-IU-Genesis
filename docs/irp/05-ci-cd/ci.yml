name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.2
        with:
          extra_args: --only-verified

  backend-build-test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore backend/AcingIU.sln
      - name: Build
        run: dotnet build backend/AcingIU.sln -c Release --no-restore
      - name: Test
        run: |
          set -euo pipefail
          if ! find tests -name '*.csproj' -print -quit | grep -q .; then
            echo "ERROR: No test projects under tests/"
            exit 1
          fi
          dotnet test backend/AcingIU.sln -c Release --no-build --verbosity normal \
            --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Lint OpenAPI
        run: |
          set -euo pipefail
          SPECS=""
          for p in \
            docs/irp/03-openapi/identity.openapi.yaml \
            docs/irp/03-openapi/device-trust.openapi.yaml \
            irp/03-openapi/identity.openapi.yaml \
            irp/03-openapi/device-trust.openapi.yaml
          do
            if [ -f "$p" ]; then SPECS="$SPECS $p"; fi
          done
          if [ -z "$SPECS" ]; then
            echo "ERROR: No OpenAPI specs found"
            exit 1
          fi
          for spec in $SPECS; do
            echo "Linting $spec"
            npx --yes @redocly/cli@1.25.15 lint "$spec"
          done
