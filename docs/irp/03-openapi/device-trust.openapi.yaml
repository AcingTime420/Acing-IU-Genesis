openapi: 3.1.0

info:
  title: Acing IU Device Trust API
  version: 1.1.0
  description: |
    Genesis device-trust service for telemetry submission, device trust
    evaluation, inventory lookup, and health monitoring.

    Telemetry updates already-enrolled devices only; unknown identifiers return
    404 and do not enroll devices. Owners may read/update their devices;
    Admin and Operator may access any enrolled device. Unknown and unauthorized
    device reads use the same 404 response.

    Trust scoring follows configured policy rules. Errors use RFC 9457
    problem details with the application/problem+json media type.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /
    description: Current gateway host

tags:
  - name: Trust
    description: Device telemetry, trust state, and device inventory
  - name: Health
    description: Service health and readiness checks

paths:
  /api/trust/telemetry/submit:
    post:
      summary: Submit telemetry for an enrolled device
      operationId: submitTelemetry
      tags:
        - Trust
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetrySubmission'
      responses:
        '200':
          description: Telemetry accepted and trust state evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustEvaluationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          description: Device is unknown or not authorized; no enrollment occurs.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/trust/devices/{hwId}:
    get:
      summary: Retrieve a device by hardware identifier
      operationId: getDevice
      tags:
        - Trust
      security:
        - bearerAuth: []
      parameters:
        - name: hwId
          in: path
          required: true
          description: Stable hardware identifier for the device
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Device trust record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetails'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /api/trust/devices:
    get:
      summary: List registered devices
      operationId: listDevices
      tags:
        - Trust
      security:
        - bearerAuth: []
      description: Requires Admin or Operator role
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceListItem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /health/live:
    get:
      summary: Check service liveness
      operationId: trustLive
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service process is alive
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /health/ready:
    get:
      summary: Check service readiness
      operationId: trustReady
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is ready to receive traffic
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token supplied in the Authorization header

  responses:
    Problem:
      description: RFC 9457 problem details response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    TelemetrySubmission:
      type: object
      additionalProperties: false
      required:
        - hwIdentifier
        - socModel
      properties:
        hwIdentifier:
          type: string
          minLength: 1
          maxLength: 100
        socModel:
          type: string
          minLength: 1
          maxLength: 100
        selinuxStatus:
          type: string
          minLength: 1
          maxLength: 50
          default: Enforcing
        bootloaderLocked: { type: boolean }
        partitionsUnmodified: { type: boolean }
        knoxWarrantyFuseIntact: { type: boolean }
        isRooted: { type: boolean }

    TrustEvaluationResponse:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - hwIdentifier
        - socModel
        - trustScore
        - allowed
        - threshold
        - breakdown
        - updatedAt
      properties:
        deviceId:
          type: string
          format: uuid
        hwIdentifier:
          type: string
        socModel:
          type: string
        trustScore: { type: integer, minimum: 0, maximum: 100 }
        allowed: { type: boolean }
        threshold: { type: integer }
        updatedAt: { type: string, format: date-time }
        breakdown:
          type: object
          additionalProperties: false
          required: [selinuxPoints, bootloaderPoints, partitionPoints, knoxPoints, rootPenalty]
          properties:
            selinuxPoints: { type: integer }
            bootloaderPoints: { type: integer }
            partitionPoints: { type: integer }
            knoxPoints: { type: integer }
            rootPenalty: { type: integer }

    DeviceDetails:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - hwIdentifier
        - socModel
        - trustScore
        - allowed
        - threshold
        - breakdown
        - updatedAt
      properties:
        deviceId:
          type: string
          format: uuid
        hwIdentifier:
          type: string
        socModel:
          type: string
        trustScore: { type: integer, minimum: 0, maximum: 100 }
        allowed: { type: boolean }
        threshold: { type: integer }
        updatedAt: { type: string, format: date-time }
        breakdown:
          type: object
          additionalProperties: false
          required: [selinuxPoints, bootloaderPoints, partitionPoints, knoxPoints, rootPenalty]
          properties:
            selinuxPoints: { type: integer }
            bootloaderPoints: { type: integer }
            partitionPoints: { type: integer }
            knoxPoints: { type: integer }
            rootPenalty: { type: integer }

    DeviceListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - hwIdentifier
        - socModel
        - trustScore
      properties:
        id: { type: string, format: uuid }
        hwIdentifier: { type: string }
        socModel: { type: string }
        trustScore: { type: integer, minimum: 0, maximum: 100 }
        selinuxStatus: { type: string }
        knoxWarrantyFuseBlown: { type: boolean }
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time

    ProblemDetails:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type:
            - string
            - 'null'
        traceId:
          type:
            - string
            - 'null'