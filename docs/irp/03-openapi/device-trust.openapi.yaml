openapi: 3.1.0

info:
  title: Acing IU Device Trust API
  version: 1.1.0
  description: |
    Genesis device-trust service for telemetry submission, device trust
    evaluation, inventory lookup, and health monitoring.

    Telemetry submission updates **already enrolled** devices only.
    Unknown hardware identifiers are rejected (HTTP 404); enrollment is a
    separate authorized workflow and is not performed by this operation.

    Object-level authorization: non-privileged callers may only read or update
    devices they own. Admin and Operator may act on any enrolled device without
    reassigning ownership. Cross-owner and unknown cases return 404.

    Errors use RFC 9457 problem details.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /
    description: Current gateway host

tags:
  - name: Trust
    description: Device telemetry, trust state, and device inventory
  - name: Health
    description: Service health and readiness checks

paths:
  /api/trust/telemetry/submit:
    post:
      summary: Submit telemetry for an enrolled device
      operationId: submitTelemetry
      tags:
        - Trust
      security:
        - bearerAuth: []
      description: |
        Updates trust telemetry for a device that is already registered.
        Does not create devices. Returns 404 when the hardware identifier is
        unknown, owned by another user, or otherwise unauthorized for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetrySubmission'
      responses:
        '200':
          description: Telemetry accepted and trust state evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustEvaluationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          description: |
            Device not registered, not owned by the caller, or not authorized.
            Same problem body is used for unknown and unauthorized cases.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/trust/devices/{hwId}:
    get:
      summary: Retrieve a device by hardware identifier
      operationId: getDevice
      tags:
        - Trust
      security:
        - bearerAuth: []
      parameters:
        - name: hwId
          in: path
          required: true
          description: Stable hardware identifier for the device
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Device trust record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetails'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /api/trust/devices:
    get:
      summary: List registered devices
      operationId: listDevices
      tags:
        - Trust
      security:
        - bearerAuth: []
      description: Requires Admin or Operator role
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceListItem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /health/live:
    get:
      summary: Check service liveness
      operationId: trustLive
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service process is alive
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /health/ready:
    get:
      summary: Check service readiness
      operationId: trustReady
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is ready to receive traffic
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token supplied in the Authorization header

  responses:
    Problem:
      description: RFC 9457 problem details response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    TelemetrySubmission:
      type: object
      additionalProperties: false
      required:
        - hwIdentifier
        - socModel
        - selinuxStatus
      properties:
        hwIdentifier:
          type: string
          minLength: 1
          maxLength: 100
        socModel:
          type: string
          minLength: 1
          maxLength: 100
        selinuxStatus:
          type: string
          maxLength: 50
        bootloaderLocked:
          type: boolean
        partitionsUnmodified:
          type: boolean
        knoxWarrantyFuseIntact:
          type: boolean
        isRooted:
          type: boolean

    TrustEvaluationResponse:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - hwIdentifier
        - trustScore
        - allowed
        - threshold
      properties:
        deviceId:
          type: string
          format: uuid
        hwIdentifier:
          type: string
        socModel:
          type: string
        trustScore:
          type: integer
          minimum: 0
          maximum: 100
        allowed:
          type: boolean
        threshold:
          type: integer
        updatedAt:
          type: string
          format: date-time
        breakdown:
          type: object
          additionalProperties: true

    DeviceDetails:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - hwIdentifier
        - trustScore
        - allowed
        - threshold
      properties:
        deviceId:
          type: string
          format: uuid
        hwIdentifier:
          type: string
        socModel:
          type: string
        trustScore:
          type: integer
          minimum: 0
          maximum: 100
        allowed:
          type: boolean
        threshold:
          type: integer
        updatedAt:
          type: string
          format: date-time

    DeviceListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - hwIdentifier
        - trustScore
      properties:
        id:
          type: string
          format: uuid
        hwIdentifier:
          type: string
        socModel:
          type: string
        trustScore:
          type: integer
          minimum: 0
          maximum: 100
        selinuxStatus:
          type: string
        knoxWarrantyFuseBlown:
          type: boolean
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time

    ProblemDetails:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type:
            - string
            - 'null'
        traceId:
          type:
            - string
            - 'null'
