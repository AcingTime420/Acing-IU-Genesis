name: Gradle Dependency Diagnostic

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-dependency-diagnostic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-reports:
    name: Capture Gradle dependency reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Capture dependency graphs
        shell: bash
        run: |
          set -uo pipefail
          report_dir="$RUNNER_TEMP/gradle-dependency-reports"
          mkdir -p "$report_dir"
          failures=0

          capture_report() {
            local name="$1"
            shift
            if bash ./gradlew "$@" --no-daemon --console=plain --stacktrace \
              > "$report_dir/$name.txt" 2>&1; then
              printf 'completed\n' > "$report_dir/$name.status"
            else
              printf 'failed\n' > "$report_dir/$name.status"
              failures=$((failures + 1))
            fi
          }

          capture_insight() {
            local name="$1"
            shift
            if bash ./gradlew "$@" --no-daemon --console=plain --stacktrace \
              > "$report_dir/$name.txt" 2>&1; then
              printf 'completed\n' > "$report_dir/$name.status"
            else
              printf 'failed\n' > "$report_dir/$name.status"
            fi
          }

          capture_report root-build-environment :buildEnvironment
          capture_report app-build-environment :app:buildEnvironment
          capture_report debug-runtime :app:dependencies --configuration debugRuntimeClasspath
          capture_report release-runtime :app:dependencies --configuration releaseRuntimeClasspath
          capture_report app-dependencies :app:dependencies
          capture_report android-test-runtime :app:dependencies --configuration debugAndroidTestRuntimeClasspath
          capture_insight unit-test-bouncycastle-insight :app:dependencyInsight \
            --configuration debugUnitTestRuntimeClasspath --dependency org.bouncycastle:bcprov-jdk18on
          capture_insight android-test-netty-insight :app:dependencyInsight \
            --configuration debugAndroidTestRuntimeClasspath --dependency io.netty

          if (( failures > 0 )); then
            echo "One or more dependency reports could not be generated; see the report artifact."
            exit 1
          fi
          echo "All Gradle dependency reports were generated; see the report artifact."

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gradle-dependency-reports
          path: ${{ runner.temp }}/gradle-dependency-reports/
          if-no-files-found: ignore
          retention-days: 7
