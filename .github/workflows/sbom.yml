name: Generate SBOM

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: SPDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: acing-iu-genesis.spdx.json
          upload-artifact: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: acing-iu-genesis-sbom
          path: acing-iu-genesis.spdx.json
          if-no-files-found: error
          retention-days: 30
