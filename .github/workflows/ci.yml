name: CI — Clean-Clone Baseline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  # ── Job 1: Enforce no tracked generated artifacts ─────────────────────
  repo-integrity:
    name: Repository Integrity (no tracked artifacts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for tracked generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          PATTERNS=("bin" "obj" "out" "dist" "TestResults" "coverage" "node_modules" ".next")
          for pattern in "${PATTERNS[@]}"; do
            matches=$(git ls-files -- "$pattern" 2>/dev/null || true)
            if [[ -n "$matches" ]]; then
              echo "::error::Tracked generated files under '${pattern}/':${matches}"
              FAIL=1
            fi
          done
          if [[ "$FAIL" -eq 1 ]]; then
            echo ""
            echo "One or more generated artifact directories are tracked in git."
            echo "Remove them with: git rm -r --cached <path>"
            echo "Then add the paths to .gitignore."
            exit 1
          fi
          echo "No tracked generated artifacts found."

  # ── Job 2: Full validate-premerge (build + conditional compose) ────────
  validate-baseline:
    name: Validate Pre-merge Baseline
    runs-on: ubuntu-latest
    needs: repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from example (when present)
        shell: bash
        run: |
          if [[ -f ".env.example" ]]; then
            cp .env.example .env
            echo ".env created from .env.example"
          else
            echo "No .env.example found — skipping"
          fi

      - name: Set up Java (for Kotlin/JAR toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Kotlin compiler
        shell: bash
        run: |
          # Install Kotlin via SDKMAN or direct download
          KOTLIN_VERSION="2.0.0"
          curl -fsSL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Run validate-premerge.sh
        shell: bash
        run: bash scripts/validate-premerge.sh --skip-compose

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validate-premerge-logs
          path: |
            **/out/
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ── Job 3: Backend build and test (.NET) ───────────────────────────────
  backend-build-test:
    name: Backend Build & Test (.NET)
    runs-on: ubuntu-latest
    needs: repo-integrity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          if [ -f backend/AcingIU.sln ]; then
            dotnet restore backend/AcingIU.sln
          else
            echo "No backend solution found — skipping"
          fi

      - name: Build Backend Solution
        run: |
          if [ -f backend/AcingIU.sln ]; then
            dotnet build backend/AcingIU.sln --configuration Release --no-restore
          else
            echo "No backend solution found — skipping"
          fi

      - name: Run Backend Tests
        run: |
          if [ -f backend/AcingIU.sln ]; then
            dotnet test backend/AcingIU.sln --configuration Release --no-build --verbosity normal
          else
            echo "No backend solution found — skipping"
          fi

  # ── Job 4: Frontend build and test (Node.js) ──────────────────────────
  frontend-build-test:
    name: Frontend Build & Test (Node.js)
    runs-on: ubuntu-latest
    needs: repo-integrity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package*.json'

      - name: Install lockfile-pinned dependencies
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            cd frontend && npm ci
          else
            echo "frontend/package.json and frontend/package-lock.json are required for deterministic validation"
            exit 1
          fi

      - name: Lint and Test Frontend
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm run lint --if-present && npm test --if-present
          else
            echo "No frontend package.json found — skipping"
          fi
        env:
          CI: true

      - name: Build Next.js Frontend
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm run build --if-present
          else
            echo "No frontend package.json found — skipping"
          fi

  # ── Job 5: Container build (Docker) ───────────────────────────────────
  containerization:
    name: Container Build (Docker)
    needs: [backend-build-test, frontend-build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Service Container
        run: |
          if [ -f backend/Gateway/Dockerfile ]; then
            docker build -t acing-iu-gateway:latest -f backend/Gateway/Dockerfile backend
          else
            echo "Gateway Dockerfile not ready — skipping"
          fi

      - name: Build Next.js Frontend Container
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t acing-iu-frontend:latest -f frontend/Dockerfile frontend
          else
            echo "Frontend Dockerfile not ready — skipping"
          fi
