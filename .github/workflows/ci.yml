name: CI — Clean-Clone Baseline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  # ── Job 1: Enforce no tracked generated artifacts ─────────────────────
  repo-integrity:
    name: Repository Integrity (no tracked artifacts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check for tracked generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          PATTERNS=("bin" "obj" "out" "dist" "TestResults" "coverage" "node_modules" ".next")
          for pattern in "${PATTERNS[@]}"; do
            matches=$(git ls-files -- "$pattern" 2>/dev/null || true)
            if [[ -n "$matches" ]]; then
              echo "::error::Tracked generated files under '${pattern}/':${matches}"
              FAIL=1
            fi
          done
          if [[ "$FAIL" -eq 1 ]]; then
            echo ""
            echo "One or more generated artifact directories are tracked in git."
            echo "Remove them with: git rm -r --cached <path>"
            echo "Then add the paths to .gitignore."
            exit 1
          fi
          echo "No tracked generated artifacts found."

      - name: Claim-surface lint (issue #63)
        shell: bash
        run: |
          chmod +x scripts/check-claim-surface.sh
          bash scripts/check-claim-surface.sh

  # ── Job 2: Full validate-premerge (build + conditional compose) ────────
  validate-baseline:
    name: Validate Pre-merge Baseline
    runs-on: ubuntu-latest
    needs: repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create .env from example (when present)
        shell: bash
        run: |
          if [[ -f ".env.example" ]]; then
            cp .env.example .env
            echo ".env created from .env.example"
          else
            echo "No .env.example found — skipping"
          fi

      - name: Set up Java (for Kotlin/JAR toolchain)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Kotlin compiler
        shell: bash
        run: |
          # Install Kotlin via SDKMAN or direct download
          KOTLIN_VERSION="2.0.0"
          curl -fsSL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Run validate-premerge.sh
        shell: bash
        run: bash scripts/validate-premerge.sh --skip-compose

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validate-premerge-logs
          path: |
            **/out/
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ── Job 3: Backend build and test (.NET) ───────────────────────────────
  backend-build-test:
    name: Backend Build & Test (.NET)
    runs-on: ubuntu-latest
    needs: repo-integrity
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          if [ -f backend/AcingIU.sln ]; then
            dotnet restore backend/AcingIU.sln
          else
            echo "No backend solution found — skipping"
          fi

      - name: Build Backend Solution
        run: |
          if [ -f backend/AcingIU.sln ]; then
            dotnet build backend/AcingIU.sln --configuration Release --no-restore
          else
            echo "No backend solution found — skipping"
          fi

      - name: Run Backend Tests
        run: |
          if [ -f backend/AcingIU.sln ]; then
            dotnet test backend/AcingIU.sln --configuration Release --no-build --verbosity normal
          else
            echo "No backend solution found — skipping"
          fi

  # ── Job 4: Frontend build and test (Node.js) ──────────────────────────
  frontend-build-test:
    name: Frontend Build & Test (Node.js)
    runs-on: ubuntu-latest
    needs: repo-integrity
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package*.json'

      - name: Install lockfile-pinned dependencies
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            cd frontend && npm ci
          else
            echo "frontend/package.json and frontend/package-lock.json are required for deterministic validation"
            exit 1
          fi

      - name: Lint and Test Frontend
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm run lint --if-present && npm test --if-present
          else
            echo "No frontend package.json found — skipping"
          fi
        env:
          CI: true

      - name: Build Next.js Frontend
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm run build --if-present
          else
            echo "No frontend package.json found — skipping"
          fi

      - name: Genesis adapter and session tests
        working-directory: frontend
        run: |
          npm run test:genesis
          npm run test:genesis-session
          node --experimental-strip-types --test tests/genesis-reimbursement-session.test.mjs
          npm run test:lint

      - name: Genesis production HTTP boundary tests
        working-directory: frontend
        run: |
          npm run test:genesis-live-http
          node --test tests/genesis-reimbursement-http.test.mjs

  human-authority-integration:
    name: Human Authority HTTP/PostgreSQL (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    needs: repo-integrity
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authority_test
          POSTGRES_PASSWORD: isolated_ci_password_only
          POSTGRES_DB: genesis_authority_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authority_test -d genesis_authority_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GENESIS_TEST_DATABASE: Host=127.0.0.1;Database=genesis_authority_test;Username=authority_test;Password=isolated_ci_password_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Set up Node for connected reviewer test
        if: matrix.configuration == 'Release'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Run connected Chromium and PostgreSQL reviewer test
        if: matrix.configuration == 'Release'
        working-directory: frontend
        env:
          ASPNETCORE_ENVIRONMENT: Test
          PGHOST: 127.0.0.1
          PGDATABASE: genesis_authority_test
          PGUSER: authority_test
          PGPASSWORD: isolated_ci_password_only
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          npm ci --no-audit --no-fund
          npm run build
          npm install --prefix "$scratch/browser" --no-audit --no-fund --ignore-scripts playwright@1.65.0
          "$scratch/browser/node_modules/.bin/playwright" install chromium --only-shell
          dotnet build ../backend/HumanAuthority/HumanAuthority.csproj --configuration Release
          python3 ../scripts/genesis-authority.py migrate
          python3 ../scripts/genesis-authority.py --credentials "$scratch/fixtures.json" fixtures
          node tests/genesis-connected-browser.mjs "$scratch/fixtures.json" "$scratch/browser"
          python3 ../scripts/genesis-reimbursements.py --credentials "$scratch/fixtures.json" migrate
          node tests/genesis-reimbursement-connected.mjs "$scratch/fixtures.json" "$scratch/browser"
      - name: Local credential file guard regressions
        run: python3 -m unittest discover -s tests -p test_authority_credentials.py
      - name: Run actual authority HTTP and PostgreSQL integration tests
        run: dotnet test tests/HumanAuthority.IntegrationTests/HumanAuthority.IntegrationTests.csproj --configuration "${{ matrix.configuration }}" --verbosity normal
      - name: DeviceTrust canonical-source HTTP and PostgreSQL ownership tests
        env:
          PGHOST: 127.0.0.1
          PGUSER: authority_test
          PGPASSWORD: isolated_ci_password_only
          GENESIS_DEVICETRUST_TEST_DATABASE: Host=127.0.0.1;Database=genesis_devicetrust_test;Username=authority_test;Password=isolated_ci_password_only
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE genesis_devicetrust_test'
          dotnet test tests/DeviceTrust.OwnershipTests/DeviceTrust.OwnershipTests.csproj --configuration "${{ matrix.configuration }}"
      - name: Validate DeviceTrust real HTTP payloads against OpenAPI
        env:
          GENESIS_DEVICETRUST_TEST_DATABASE: Host=127.0.0.1;Database=genesis_devicetrust_test;Username=authority_test;Password=isolated_ci_password_only
        run: |
          python3 -m venv "$RUNNER_TEMP/devicetrust-contract"
          "$RUNNER_TEMP/devicetrust-contract/bin/python" -m pip install -r tests/DeviceTrust.OwnershipTests/contract-requirements.txt
          "$RUNNER_TEMP/devicetrust-contract/bin/python" scripts/validate-devicetrust-contract.py --configuration "${{ matrix.configuration }}" --no-restore

  human-authority-windows-artifacts:
    name: Human Authority artifact and database guards (Windows)
    runs-on: windows-latest
    needs: repo-integrity
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Native Windows credential ACL tests
        shell: pwsh
        run: |
          if (-not $IsWindows) { throw 'Actual Windows execution is required.' }
          foreach ($configuration in @('Debug', 'Release')) {
            $results = Join-Path $env:RUNNER_TEMP ("authority-acl-" + $configuration)
            dotnet test tests/AuthorityCredentialFiles.Tests/AuthorityCredentialFiles.Tests.csproj --configuration $configuration --filter 'FullyQualifiedName~NativeWindowsTests' --logger 'trx;LogFileName=native-acl.trx' --results-directory $results
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            [xml]$report = Get-Content -LiteralPath (Join-Path $results 'native-acl.trx') -Raw
            $counts = $report.TestRun.ResultSummary.Counters
            if ([int]$counts.total -ne 12 -or [int]$counts.passed -ne 12 -or [int]$counts.failed -ne 0 -or [int]$counts.notExecuted -ne 0) {
              throw 'All 12 native ACL tests must execute and pass; skipped checks do not close the gate.'
            }
          }
      - name: Windows credential helper IPC and artifact guards
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p test_authority_credentials.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate native artifact paths in Debug and Release
        shell: pwsh
        run: |
          foreach ($configuration in @('Debug', 'Release')) {
            dotnet test tests/HumanAuthority.IntegrationTests/HumanAuthority.IntegrationTests.csproj --configuration $configuration --filter 'FullyQualifiedName~BackendArtifactTests|FullyQualifiedName~DatabaseGuardTests' --verbosity normal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # ── Job 5: Container build (Docker) ───────────────────────────────────
  containerization:
    name: Container Build (Docker)
    needs: [backend-build-test, frontend-build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build Gateway Service Container
        run: |
          if [ -f backend/Gateway/Dockerfile ]; then
            docker build -t acing-iu-gateway:latest -f backend/Gateway/Dockerfile backend
          else
            echo "Gateway Dockerfile not ready — skipping"
          fi

      - name: Build Next.js Frontend Container
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t acing-iu-frontend:latest -f frontend/Dockerfile frontend
          else
            echo "Frontend Dockerfile not ready — skipping"
          fi
