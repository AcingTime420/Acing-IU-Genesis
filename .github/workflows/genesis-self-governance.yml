name: Genesis Self-Governance

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [master]
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-self-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  constitutional-integrity:
    name: Genesis Constitutional Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Validate Genesis governance
        run: python scripts/check-genesis-governance.py

      - name: Claim-surface integrity
        run: bash scripts/check-claim-surface.sh

      - name: Installer provenance
        run: bash scripts/check-installer-payload-sync.sh
