name: Containers

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # No packages:write on PR — this workflow does not run on pull_request

jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build Identity
        run: docker build -f backend/Identity/src/AcingIU.Identity.Api/Dockerfile -t acing-identity:ci .
      - name: Build Device Trust
        run: docker build -f backend/DeviceTrust/src/AcingIU.DeviceTrust.Api/Dockerfile -t acing-device-trust:ci .
      # trivy-action composes actions that are not permitted by repository policy.
      # Install the pinned release directly and verify it before either scan runs.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.70.0
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          install_dir="${RUNNER_TEMP}/trivy-bin"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar --extract --gzip --no-same-owner --file "${archive}" --directory "${install_dir}" trivy
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/trivy" --version
      - name: Trivy Identity
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH acing-identity:ci
      - name: Trivy Device Trust
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH acing-device-trust:ci
