name: Containers

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "infrastructure/**"
      - ".github/workflows/container.yml"
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build Identity
        run: docker build -f backend/Identity/src/AcingIU.Identity.Api/Dockerfile -t acing-identity:ci .
      - name: Build Device Trust
        run: docker build -f backend/DeviceTrust/src/AcingIU.DeviceTrust.Api/Dockerfile -t acing-device-trust:ci .
      - name: Trivy Identity
        id: trivy_identity
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: acing-identity:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Trivy Device Trust
        id: trivy_device_trust
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: acing-device-trust:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Enforce container scan results
        if: always()
        shell: bash
        run: |
          echo "Identity scan: ${{ steps.trivy_identity.outcome }}"
          echo "DeviceTrust scan: ${{ steps.trivy_device_trust.outcome }}"
          if [[ "${{ steps.trivy_identity.outcome }}" != "success" || "${{ steps.trivy_device_trust.outcome }}" != "success" ]]; then
            echo "::error::One or more service images contain HIGH/CRITICAL vulnerabilities."
            exit 1
          fi
