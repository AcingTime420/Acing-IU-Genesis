name: Secret policy verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  secret-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks-policy"
          mkdir -p "$scanner_dir"
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -fsSL "$release/gitleaks_8.30.1_linux_x64.tar.gz" -o "$scanner_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL "$release/gitleaks_8.30.1_checksums.txt" -o "$scanner_dir/checksums.txt"
          (cd "$scanner_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$scanner_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$scanner_dir" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Verify future-secret detection and historical conjunction
        run: python3 tests/security/test_gitleaks_policy.py
      - name: Scan full history without weakening the gate
        run: gitleaks git . --config .gitleaks.toml --log-opts=--all --redact=100 --no-banner
