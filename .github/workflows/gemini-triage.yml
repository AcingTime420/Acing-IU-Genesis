name: '🔀 Gemini Triage'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-triage-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  triage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    outputs:
      available_labels: '${{ steps.get_labels.outputs.available_labels }}'
      selected_labels: '${{ env.SELECTED_LABELS }}'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    steps:
      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # ratchet:actions/github-script@v9.0.0
        with:
          # NOTE: we intentionally do not use the given token. The default
          # GITHUB_TOKEN provided by the action has enough permissions to read
          # the labels.
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100, // Maximum per page to reduce API calls
            })) {
              labels.push(...response.data);
            }

            if (!labels || labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.')
            }

            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);
            return labelNames;

      - name: 'Checkout repository'
        if: |-
          ${{ steps.get_labels.outputs.available_labels != '' }}
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 'Run Gemini issue analysis'
        id: 'gemini_analysis'
        if: |-
          ${{ steps.get_labels.outputs.available_labels != '' }}
        run: |-
          set -euo pipefail

          npm install --silent --no-audit --prefer-offline --global \
            "@google/gemini-cli@${GEMINI_CLI_VERSION:-latest}"

          mkdir -p .gemini/commands
          cp .github/commands/gemini-triage.toml .gemini/commands/gemini-triage.toml
          cat > .gemini/settings.json <<'EOF'
          {
            "model": {
              "maxSessionTurns": 25
            },
            "telemetry": {
              "enabled": true,
              "target": "local",
              "outfile": ".gemini/telemetry.log"
            },
            "tools": {
              "core": [
                "run_shell_command(echo)"
              ]
            }
          }
          EOF

          if [[ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]]; then
            audience="//iam.googleapis.com/${GCP_WORKLOAD_IDENTITY_PROVIDER}"
            encoded_audience="$(jq -rn --arg value "${audience}" '$value | @uri')"
            oidc_auth_header="$(printf '%s %s' 'Bearer' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}")"
            oidc_response="$(curl --fail --silent --show-error \
              --header "Authorization: ${oidc_auth_header}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
            oidc_token="$(jq -er '.value' <<< "${oidc_response}")"
            federated_response="$(curl --fail --silent --show-error \
              --request POST \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "audience=${audience}" \
              --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
              --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
              --data-urlencode 'scope=https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/userinfo.email,https://www.googleapis.com/auth/userinfo.profile' \
              --data-urlencode "subject_token=${oidc_token}" \
              --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:jwt' \
              'https://sts.googleapis.com/v1/token')"
            google_access_token="$(jq -er '.access_token' <<< "${federated_response}")"

            if [[ -n "${GCP_SERVICE_ACCOUNT}" ]]; then
              encoded_service_account="$(jq -rn --arg value "${GCP_SERVICE_ACCOUNT}" '$value | @uri')"
              google_auth_header="$(printf '%s %s' 'Bearer' "${google_access_token}")"
              impersonation_response="$(curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: ${google_auth_header}" \
                --header 'Content-Type: application/json' \
                --data '{"scope":["https://www.googleapis.com/auth/cloud-platform","https://www.googleapis.com/auth/userinfo.email","https://www.googleapis.com/auth/userinfo.profile"],"lifetime":"3600s"}' \
                "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${encoded_service_account}:generateAccessToken")"
              google_access_token="$(jq -er '.accessToken' <<< "${impersonation_response}")"
            fi

            export GOOGLE_CLOUD_ACCESS_TOKEN="${google_access_token}"
          fi

          if [[ "${GEMINI_DEBUG}" == 'true' ]]; then
            gemini --debug --yolo --prompt '/gemini-triage' --output-format json
          else
            gemini --yolo --prompt '/gemini-triage' --output-format json
          fi
        env:
          GITHUB_TOKEN: '' # Do NOT pass any auth tokens here since this runs on untrusted inputs
          ISSUE_TITLE: '${{ github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.issue.body }}'
          AVAILABLE_LABELS: '${{ steps.get_labels.outputs.available_labels }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GOOGLE_API_KEY: '${{ secrets.GOOGLE_API_KEY }}'
          GOOGLE_CLOUD_PROJECT: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          GOOGLE_CLOUD_LOCATION: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          GOOGLE_GENAI_USE_VERTEXAI: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          GOOGLE_GENAI_USE_GCA: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          GEMINI_MODEL: '${{ vars.GEMINI_MODEL }}'
          GEMINI_CLI_VERSION: '${{ vars.GEMINI_CLI_VERSION }}'
          GEMINI_DEBUG: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          GCP_WORKLOAD_IDENTITY_PROVIDER: '${{ vars.GCP_WIF_PROVIDER }}'
          GCP_SERVICE_ACCOUNT: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'

  label:
    runs-on: 'ubuntu-latest'
    needs:
      - 'triage'
    if: |-
      ${{ needs.triage.outputs.selected_labels != '' }}
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1' # ratchet:actions/create-github-app-token@v3.2.0
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Apply labels'
        env:
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          AVAILABLE_LABELS: '${{ needs.triage.outputs.available_labels }}'
          SELECTED_LABELS: '${{ needs.triage.outputs.selected_labels }}'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # ratchet:actions/github-script@v9.0.0
        with:
          # Use the provided token so that the "gemini-cli" is the actor in the
          # log for what changed the labels.
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            // Parse the available labels
            const availableLabels = (process.env.AVAILABLE_LABELS || '').split(',')
              .map((label) => label.trim())
              .sort()

            // Parse the label as a CSV, reject invalid ones - we do this just
            // in case someone was able to prompt inject malicious labels.
            const selectedLabels = (process.env.SELECTED_LABELS || '').split(',')
              .map((label) => label.trim())
              .filter((label) => availableLabels.includes(label))
              .sort()

            // Set the labels
            const issueNumber = process.env.ISSUE_NUMBER;
            if (selectedLabels && selectedLabels.length > 0) {
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: selectedLabels,
              });
              core.info(`Successfully set labels: ${selectedLabels.join(',')}`);
            } else {
              core.info(`Failed to determine labels to set. There may not be enough information in the issue or pull request.`)
            }
